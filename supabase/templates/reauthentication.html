<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Your verification code</title>
</head>
<body style="margin:0;padding:0;background:#0e1116;" bgcolor="#0e1116">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">Enter this code to confirm it’s you.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0e1116" style="background:#0e1116;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td style="padding:0 4px 20px;">
            <a href="{{ .SiteURL }}" target="_blank" style="text-decoration:none;"><img src="{{ .SiteURL }}/crisp-fm-logo.png" width="104" height="26" alt="crisp.fm" style="display:block;border:0;width:104px;height:26px;"></a>
          </td>
        </tr>
        <tr>
          <td bgcolor="#141922" style="background:#141922;border:1px solid #232a35;border-radius:12px;padding:32px 28px;">
            <h1 style="margin:0;font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:20px;font-weight:800;line-height:28px;letter-spacing:-0.01em;color:#eaf6f8;">Your verification code</h1>
            <p style="margin:12px 0 0;font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:14px;line-height:22px;color:#a9b1b8;">Enter this code in crisp.fm to confirm it’s you.</p>
            <div style="margin:24px 0 0;padding:14px 0;border:1px solid #232a35;border-radius:10px;text-align:center;font-family:'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace;font-size:26px;font-weight:700;letter-spacing:0.3em;color:#eaf6f8;">{{ .Token }}</div>
            <p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #232a35;font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;color:#6f7780;">Didn’t ask for a code? Someone may know your password. Change it to be safe.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 4px 0;font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:11px;line-height:16px;color:#6f7780;">crisp.fm · audio editing in your browser</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
