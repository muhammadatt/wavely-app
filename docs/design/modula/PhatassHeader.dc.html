      <div style="width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4px solid #a6aeb6"></div>
    </div>
    <div style="width:22px;height:22px;flex:none;display:grid;place-items:center;color:#b6bdc4;font:600 15px/1 'Inter',system-ui,sans-serif">&#8250;</div>
  </div>
  <div style="flex:none;display:flex;align-items:center;gap:10px">
    <div style="width:96px;display:flex;justify-content:flex-end">
