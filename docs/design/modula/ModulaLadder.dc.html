<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid;grid-template-columns:auto auto auto;column-gap:5px;row-gap:8px;justify-items:center;align-items:start">
  <div style="grid-column:2;grid-row:1;width:5ch;padding:4px;border-radius:5px;text-align:center;white-space:nowrap;font:500 11px/1 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:#eaf6f8;background:#1a1c20;box-shadow:inset 0 2px 5px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05)">{{ db }}</div>
  <sc-if value="{{ showL }}" hint-placeholder-val="{{ true }}">
    <div style="grid-column:1;grid-row:2;position:relative;width:18px;height:{{ h }}px">
      <div style="position:absolute;left:0;right:0;top:15px;bottom:5px;font:500 8px/1 'JetBrains Mono',monospace;color:#a0a8b0">
        <sc-for list="{{ scale }}" as="ls" hint-placeholder-count="7">
          <div style="position:absolute;right:0;transform:translateY(-50%);top:{{ ls.top }}%">{{ ls.label }}</div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <div style="grid-column:2;grid-row:2;height:{{ h }}px;box-sizing:border-box;display:flex;flex-direction:column;padding:5px;border-radius:5px;background:#0b0e13;border:1px solid #1c222c">
    <div style="height:5px;border-radius:1.5px;margin-bottom:5px;background:#262c37"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:3px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="30">
        <div style="flex:1;min-height:2px;display:flex;gap:2px">
          <div style="width:7px;border-radius:1px;background:{{ r.c }};opacity:{{ r.lo }};box-shadow:{{ r.lg }}"></div>
          <div style="width:7px;border-radius:1px;background:{{ r.c }};opacity:{{ r.ro }};box-shadow:{{ r.rg }}"></div>
        </div>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ showR }}" hint-placeholder-val="{{ false }}">
    <div style="grid-column:3;grid-row:2;position:relative;width:18px;height:{{ h }}px">
      <div style="position:absolute;left:0;right:0;top:15px;bottom:5px;font:500 8px/1 'JetBrains Mono',monospace;color:#a0a8b0">
        <sc-for list="{{ scale }}" as="ls" hint-placeholder-count="7">
          <div style="position:absolute;left:0;transform:translateY(-50%);top:{{ ls.top }}%">{{ ls.label }}</div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <div style="grid-column:2;grid-row:3;font:600 9px/1 'Inter',system-ui,sans-serif;letter-spacing:.14em;color:#aeb6bd">{{ label }}</div>
  <sc-if value="{{ trim }}" hint-placeholder-val="{{ true }}">
    <div style="grid-column:2;grid-row:4;display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:4px">
      <div style="width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.35)"></div>
      <div style="position:relative;width:30px;height:30px;border-radius:50%;background:linear-gradient(160deg,#3e4249 0%,#282b30 55%,#1d1f23 100%);box-shadow:0 8px 14px -8px rgba(0,0,0,.95),inset 0 1px 1px rgba(255,255,255,.10),0 0 0 1px rgba(0,0,0,.65)">
        <div style="position:absolute;left:50%;top:4px;width:2px;height:8px;margin-left:-1px;border-radius:1px;background:#eaf6f8"></div>
      </div>
      <div style="white-space:nowrap;font:500 9px/1 'JetBrains Mono',monospace;color:#c9d0d6">0.0 dB</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:90,&quot;height&quot;:340},&quot;level&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;side&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;right&quot;],&quot;default&quot;:&quot;left&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;IN&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:236,&quot;tsType&quot;:&quot;number&quot;},&quot;rows&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;},&quot;trim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const LAD = { cool: '#3FD0DE', mid: '#8FD48A', warm: '#E8A33D', hot: '#FF5A4E' };
class Component extends DCLogic {
  renderVals() {
    const N = this.props.rows ?? 30, l = this.props.level ?? .55, r = this.props.levelR ?? Math.max(0, l - .04);
    const pk = this.props.peak ?? Math.min(1, Math.max(l, r) + .14);
    const lit = [Math.round(l * N), Math.round(r * N)], pkI = Math.round(pk * N) - 1;
    const rows = Array.from({ length: N }, (_, j) => {
      const fb = N - 1 - j, t = 1 - j / (N - 1);
      const c = t > .93 ? LAD.hot : t > .78 ? LAD.warm : t > .5 ? LAD.mid : LAD.cool;
      const side = i => { const on = fb < lit[i], isP = fb === pkI; return on || isP ? [on ? 1 : .8, '0 0 6px ' + c] : [.09, 'none']; };
      const L = side(0), R = side(1);
      return { c, lo: L[0], lg: L[1], ro: R[0], rg: R[1] };
    });
    const side = this.props.side ?? 'left';
    return {
      rows, h: this.props.height ?? 236, label: this.props.label ?? 'IN',
      showL: side === 'left', showR: side === 'right', trim: this.props.trim ?? true,
      db: (-42 * (1 - Math.max(l, r))).toFixed(1),
      scale: [['0', 0], ['-6', 14.3], ['-12', 28.6], ['-18', 42.9], ['-24', 57.1], ['-30', 71.4], ['-36', 85.7]].map(([label, top]) => ({ label, top }))
    };
  }
}
</script>
</body>
</html>
