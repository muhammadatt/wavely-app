<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;padding:2px;gap:2px;border-radius:9px;background:#1a1c20;box-shadow:inset 0 2px 5px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.05)">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
    <sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ it.pick }}" style="flex:1 1 auto;height:20px;padding:0 10px;border:none;border-radius:7px;cursor:pointer;white-space:nowrap;font:700 9px/1 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7fe9f6;background:linear-gradient(180deg,#3c4655,#2c343f);box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(0,0,0,.6), 0 6px 12px -6px rgba(0,0,0,.9)">{{ it.label }}</button>
    </sc-if>
    <sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ it.pick }}" style="flex:1 1 auto;height:20px;padding:0 10px;border:none;border-radius:7px;cursor:pointer;white-space:nowrap;font:700 9px/1 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a0a8b0;background:transparent" style-hover="color:#eaf6f8">{{ it.label }}</button>
    </sc-if>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:40},&quot;options&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;HARD,SOFT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { i: null };
  renderVals() {
    const opts = (this.props.options ?? 'A,B').split(',');
    const cur = this.state.i ?? this.props.value ?? 0;
    return {
      items: opts.map((label, i) => ({ label, on: i === cur, off: i !== cur, pick: () => { this.setState({ i }); this.props.onChange?.(i); } })),
    };
  }
}
</script>
</body>
</html>
