<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onPointerDown="{{ down }}" onDoubleClick="{{ reset }}" role="slider" style="position:relative;width:44px;height:176px;border-radius:12px;cursor:ns-resize;touch-action:none;user-select:none;background:linear-gradient(180deg,#232a33,#1c2128);box-shadow:inset 0 2px 8px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.04), 0 1px 0 rgba(255,255,255,.04)">
  <div style="position:absolute;left:20px;top:24px;bottom:24px;width:4px;border-radius:2px;background:#0e0f11;box-shadow:inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06)"></div>
  <div style="position:absolute;left:20px;bottom:24px;width:4px;border-radius:2px;height:{{ fillH }};background:{{ color }};box-shadow:0 0 6px {{ color }}"></div>
  <div style="position:absolute;left:8px;top:0;width:28px;height:56px;border-radius:6px;transform:{{ capT }};background:linear-gradient(180deg,#5d687a 0%,#3e4757 20%,#2a313b 50%,#3e4757 80%,#232a33 100%);box-shadow:0 16px 20px -8px rgba(0,0,0,.95), 0 4px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.65)">
    <div style="position:absolute;left:6px;right:6px;top:8px;height:14px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.5) 0 1px,rgba(255,255,255,.1) 1px 2px,transparent 2px 5px)"></div>
    <div style="position:absolute;left:6px;right:6px;bottom:8px;height:14px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.5) 0 1px,rgba(255,255,255,.1) 1px 2px,transparent 2px 5px)"></div>
    <div style="position:absolute;left:3px;right:3px;top:calc(50% - 1px);height:2px;border-radius:1px;background:#8e9297"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:190},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;default&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#a98bff&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { v: null };
  val() { return this.state.v ?? this.props.value ?? 0.5; }
  renderVals() {
    const v = this.val(), span = 90;
    return {
      color: this.props.color ?? '#e8a33d',
      capT: `translate3d(0, ${(43 + (1 - v) * span - 28).toFixed(1)}px, 0)`,
      fillH: `${(19 + v * span).toFixed(1)}px`,
      down: (e) => {
        e.preventDefault();
        const y0 = e.clientY, v0 = this.val();
        const mv = (ev) => { const nv = Math.max(0, Math.min(1, v0 + (y0 - ev.clientY) / span)); this.setState({ v: nv }); this.props.onChange?.(nv); };
        const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
        window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
      },
      reset: () => { const nv = this.props.value ?? 0.5; this.setState({ v: nv }); this.props.onChange?.(nv); },
    };
  }
}
</script>
</body>
</html>
