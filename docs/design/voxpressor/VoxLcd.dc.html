<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-start;gap:3px;user-select:none">
  <div tabIndex="0" role="spinbutton" onKeyDown="{{ key }}" style="position:relative;width:64px;height:26px;box-sizing:border-box;border:1px solid #000;border-radius:2px;overflow:hidden;outline:none;background:linear-gradient(180deg,#07080a 0%,#0d0f12 55%,#060708 100%);box-shadow:{{ wellSh }}">
    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 42%),radial-gradient(90% 70% at 50% 120%,rgba(255,164,53,.07),rgba(0,0,0,0) 70%)"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.06em;color:#c09055;text-shadow:0 0 4px rgba(255,140,40,.25)">{{ cur }}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <div role="button" tabIndex="0" onClick="{{ up }}" style="width:13px;height:12px;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#54585f 0%,#3a3e44 42%,#25282d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 2px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5)" style-active="transform:translateY(1px)"><div style="width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:4px solid #f4f7f8"></div></div>
    <div role="button" tabIndex="0" onClick="{{ down }}" style="width:13px;height:12px;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#54585f 0%,#3a3e44 42%,#25282d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 2px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5)" style-active="transform:translateY(1px)"><div style="width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid #f4f7f8"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:100,&quot;height&quot;:40},&quot;options&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GENTLE,NORMAL,FAST,AUTO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { i: null };
  renderVals() {
    const p = this.props, opts = (p.options ?? 'GENTLE,NORMAL,FAST,AUTO').split(','), n = opts.length;
    const cur = this.state.i ?? p.value ?? 0;
    const go = (d) => { const j = (cur + d + n) % n; this.setState({ i: j }); p.onChange?.(j); };
    return {
      cur: opts[cur], up: () => go(1), down: () => go(-1),
      wellSh: p.surface === 'light' ? 'inset 0 2px 4px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.6)' : 'inset 0 2px 4px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.06)',
      key: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); go(1); } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); go(-1); } },
    };
  }
}
</script>
</body>
</html>
