<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="radiogroup" style="display:flex;gap:8px;user-select:none">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
    <button role="radio" title="{{ it.title }}" onClick="{{ it.pick }}" style="display:grid;place-items:center;width:36px;height:30px;padding:0;border:none;border-radius:7px;cursor:pointer;transition:transform .08s, box-shadow .12s;transform:{{ it.tf }};background:{{ it.bg }};box-shadow:{{ it.sh }}" style-hover="filter:brightness(1.08)">
      <svg viewBox="0 0 24 18" width="24" height="18" fill="none" style="overflow:visible">
        <path d="{{ it.d }}" stroke="{{ it.ink }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter:{{ it.glow }}"></path>
      </svg>
    </button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:100,&quot;height&quot;:44},&quot;value&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e8a33d&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;surface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { i: null };
  renderVals() {
    const p = this.props, light = p.surface === 'light';
    const a = p.color ?? '#e8a33d';
    const cur = this.state.i ?? p.value ?? 0;
    const shapes = [
      { title: 'Hard knee', d: 'M3 15 L12 6 L21 4' },
      { title: 'Soft knee', d: 'M3 15 L8 10 C11 7 14 5.2 21 4' },
    ];
    return {
      items: shapes.map((s, i) => {
        const on = i === cur;
        return {
          ...s, pick: () => { this.setState({ i }); p.onChange?.(i); },
          tf: on ? 'translateY(1px)' : 'none',
          bg: on ? 'linear-gradient(180deg,#262d36,#323b48)' : 'linear-gradient(160deg,#4d596a 0%,#323b48 52%,#222931 100%)',
          sh: on
            ? (light ? 'inset 0 2px 5px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.55)' : 'inset 0 2px 5px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.7)')
            : (light ? 'inset 0 1px 0 rgba(255,255,255,.2), 0 1px 1px rgba(40,30,20,.35), 0 5px 9px -4px rgba(40,30,20,.4)' : 'inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 1px rgba(0,0,0,.65), 0 6px 10px -5px rgba(0,0,0,.9)'),
          ink: on ? a : 'rgba(234,246,248,.45)',
          axis: 'rgba(234,246,248,.18)',
          glow: on ? `drop-shadow(0 0 2px ${a})` : 'none',
        };
      }),
    };
  }
}
</script>
</body>
</html>
