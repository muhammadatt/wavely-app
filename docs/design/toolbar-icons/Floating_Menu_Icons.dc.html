<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/colors.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/typography.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/radius.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/motion.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/tokens/layers.css">
  <link rel="stylesheet" href="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/styles.css">
  <script src="_ds/crisp-fm-design-system-2acdbab5-f20a-4311-90ec-ac92c4f83b32/_ds_bundle.js"></script>
  <style>body{margin:0;background:linear-gradient(160deg,#181c22,#0c0f13 62%);min-height:100vh}a{color:#7fe9f6}a:hover{color:#86e8ff}</style>
</helmet>
<section style="display:flex;flex-direction:column;gap:22px;padding:40px;font-family:'Inter',system-ui,sans-serif;color:var(--color-text)">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--color-text-softer)">TURN 1</div>
    <div style="font-size:15px;font-weight:700">Floating menu icons — three directions</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start">
    <sc-for list="{{ options }}" as="opt" hint-placeholder-count="3">
      <div id="{{ opt.id }}" style="display:flex;flex-direction:column;gap:20px;padding:22px 26px 26px;border-radius:16px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);width:960px;box-sizing:border-box">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.14em;padding:4px 8px;border-radius:5px;background:rgba(53,211,230,.12);color:#7fe9f6;box-shadow:inset 0 0 0 1px rgba(53,211,230,.4)">{{ opt.id }}</span>
          <span style="font-size:15px;font-weight:700">{{ opt.name }}</span>
          <span style="font-size:13px;color:var(--color-text-softer)">{{ opt.note }}</span>
        </div>
        <div style="display:flex;align-items:center;gap:18px;padding:26px 20px;border-radius:12px;background:linear-gradient(180deg,#12161b,#0e1216);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)">
          <x-import component-from-global-scope="CrispFmDesignSystem_2acdba.ToolbarTray" hint-size="720px,48px">
            <sc-for list="{{ opt.tray }}" as="ic" hint-placeholder-count="6">
              <x-import component-from-global-scope="CrispFmDesignSystem_2acdba.ToolbarChip" title="{{ ic.label }}" hint-size="100px,40px">{{ ic.sm }}<sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><span>{{ ic.label }}</span></sc-if></x-import>
            </sc-for>
          </x-import>
          <x-import component-from-global-scope="CrispFmDesignSystem_2acdba.ToolbarChip" active="{{ true }}" title="Chain" hint-size="100px,40px">{{ opt.chain.sm }}<sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><span>Chain</span></sc-if></x-import>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px">
          <sc-for list="{{ opt.all }}" as="ic" hint-placeholder-count="7">
            <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03)">
              <div style="display:flex;color:var(--color-text)">{{ ic.lg }}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--color-text-softer)">{{ ic.mono }}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;strokeWidth&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[1.75,2,2.25],&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;showLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sw = this.props.strokeWidth ?? 2;
    const svg = (inner, s, w) => React.createElement('svg', { viewBox: '0 0 24 24', width: s, height: s, fill: 'none', stroke: 'currentColor', strokeWidth: w, strokeLinecap: 'round', strokeLinejoin: 'round', style: { display: 'block', flexShrink: 0 }, dangerouslySetInnerHTML: { __html: inner } });
    const labels = ['Edit', 'Level', 'Dynamics', 'Tone', 'Fix', 'Master', 'Chain'];
    const sets = [
      { id: '1a', name: 'Studio objects', note: 'Each icon is the tool itself', icons: [
        '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
        '<path d="M12 3v8M12 17v4"/><rect x="8" y="11" width="8" height="6" rx="1.5"/>',
        '<path d="M12 3v6M9 6l3 3 3-3M12 21v-6M9 18l3-3 3 3M4 12h16"/>',
        '<path d="M3 18h3c3 0 3-12 6-12s3 12 6 12h3"/>',
        '<path d="M4 20 15 9M17 3v4M15 5h4M20 11v3M18.5 12.5h3"/>',
        '<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>',
        '<rect x="2" y="9" width="5" height="6" rx="1.5"/><rect x="9.5" y="9" width="5" height="6" rx="1.5"/><rect x="17" y="9" width="5" height="6" rx="1.5"/><path d="M7 12h2.5M14.5 12H17"/>'
      ]},
      { id: '1b', name: 'Signal shapes', note: 'Drawn as what happens to the sound', icons: [
        '<path d="M7 4H5v16h2M17 4h2v16h-2M10 9v6M12 6v12M14 10v4"/>',
        '<path d="M3 5h18M3 19h18M7 9v6M12 9v6M17 9v6"/>',
        '<path d="M3 20 11 12c1.2-1.2 2.5-2 4-2.5L21 8"/><circle cx="11" cy="12" r="1.5"/>',
        '<path d="M3 12c1.5-6 4.5-6 6 0s4.5 6 6 0 4.5-6 6 0"/>',
        '<path d="M7 20 3.7 16.7a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4L11 20zM7 20h13M9 10l5 5"/>',
        '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>',
        '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h3M14 12h3"/>'
      ]},
      { id: '1c', name: 'Console controls', note: 'Drawn as the hardware you would reach for', icons: [
        '<path d="M8 4c2 0 4 1 4 3v10c0 2-2 3-4 3M16 4c-2 0-4 1-4 3v10c0 2 2 3 4 3M9 12h6"/>',
        '<path d="M14 3v5M14 14v7M5 5h3M5 12h3M5 19h3"/><rect x="10" y="8" width="8" height="6" rx="1.5"/>',
        '<circle cx="12" cy="13" r="6"/><path d="M12 13l3-3M12 3v2M4.5 6.5 6 8M19.5 6.5 18 8"/>',
        '<path d="M6 4v8M6 16v4M12 4v2M12 10v10M18 4v6M18 14v6"/><circle cx="6" cy="14" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="18" cy="12" r="2"/>',
        '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
        '<rect x="5" y="3" width="5" height="18" rx="1.5"/><rect x="14" y="3" width="5" height="18" rx="1.5"/><path d="M5 11h5M14 8h5"/>',
        '<circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6c7 0 3 12 10 12"/>'
      ]}
    ];
    const options = sets.map(s => {
      const all = s.icons.map((inner, i) => ({ label: labels[i], mono: labels[i].toUpperCase(), sm: svg(inner, 15, sw), lg: svg(inner, 28, sw) }));
      return { ...s, all, tray: all.slice(0, 6), chain: all[6] };
    });
    return { options, showLabels: this.props.showLabels ?? true };
  }
}
</script>
</body>
</html>
